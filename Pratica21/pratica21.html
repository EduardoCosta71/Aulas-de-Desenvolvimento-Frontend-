<script>

    function calcArea(largura, altura){

        return largura * altura;

    }

    function calcPerimetro(largura, altura){

        return (largura + altura) * 2;

    }

    let resultAre = calcArea(10, 5);
    let resultPer = calcPerimetro(5, 7);

    console.log(resultAre);
    console.log(resultPer);



</script>
